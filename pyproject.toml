[project]
name = "koncili-omie-reconciliation"
version = "0.1.0"
description = "Pipeline de reconciliação automatizada entre exportações Koncili e Omie"
requires-python = ">=3.11"
authors = [
    { name = "Anderson Madoliveira" }
]
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "xlsxwriter>=3.2",
    "pandera>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "rapidfuzz>=3.9",
    "loguru>=0.7",
    "typer>=0.12",
    "faker>=25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
reconciler = "reconciler.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# typer exige chamadas typer.Option()/typer.Argument() como default de parâmetro
"src/reconciler/cli.py" = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
